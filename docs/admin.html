<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>线索管理后台 - 音链科技</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: #f1f5f9;
      color: #1f2937;
      line-height: 1.6;
    }

    /* 头部 */
    .header {
      background: linear-gradient(135deg, #1e3a5f, #1e40af);
      color: #fff;
      padding: 24px 32px;
    }
    .header h1 { font-size: 22px; font-weight: 600; }
    .header p { font-size: 14px; opacity: 0.8; margin-top: 4px; }

    /* 主体 */
    .main { max-width: 1100px; margin: 0 auto; padding: 24px 32px; }

    /* 密码锁 */
    .lock-screen {
      max-width: 400px;
      margin: 80px auto;
      text-align: center;
    }
    .lock-screen .icon { font-size: 48px; margin-bottom: 16px; }
    .lock-screen h2 { font-size: 20px; margin-bottom: 8px; }
    .lock-screen p { font-size: 14px; color: #6b7280; margin-bottom: 24px; }
    .lock-input {
      width: 100%;
      padding: 12px 16px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 16px;
      outline: none;
      margin-bottom: 12px;
    }
    .lock-input:focus { border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37,99,235,0.12); }
    .lock-btn {
      width: 100%;
      padding: 12px;
      background: #2563eb;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }
    .lock-btn:hover { background: #1d4ed8; }
    .lock-error { color: #ef4444; font-size: 14px; margin-top: 8px; display: none; }

    /* 数据概览 */
    .stats-bar {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      margin-bottom: 24px;
    }
    .stat-card {
      background: #fff;
      border-radius: 12px;
      padding: 20px;
      text-align: center;
      border: 1px solid #e2e8f0;
    }
    .stat-num { font-size: 28px; font-weight: 700; color: #2563eb; }
    .stat-label { font-size: 13px; color: #6b7280; margin-top: 4px; }

    /* 线索列表 */
    .lead-card {
      background: #fff;
      border-radius: 12px;
      border: 1px solid #e2e8f0;
      margin-bottom: 16px;
      overflow: hidden;
    }
    .lead-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 20px;
      background: #f8fafc;
      border-bottom: 1px solid #e2e8f0;
      cursor: pointer;
    }
    .lead-header:hover { background: #f1f5f9; }
    .lead-name { font-weight: 600; font-size: 15px; }
    .lead-contact { font-size: 13px; color: #6b7280; }
    .lead-time { font-size: 12px; color: #94a3b8; }
    .lead-body {
      padding: 16px 20px;
      display: none;
      font-size: 13px;
      white-space: pre-wrap;
      background: #fafbfc;
      line-height: 1.7;
    }
    .lead-body.open { display: block; }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: #94a3b8;
    }
    .empty-state .icon { font-size: 48px; margin-bottom: 16px; }
    .empty-state p { font-size: 15px; }

    /* 刷新按钮 */
    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }
    .refresh-btn {
      padding: 8px 20px;
      background: #2563eb;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      cursor: pointer;
    }
    .refresh-btn:hover { background: #1d4ed8; }
    .lead-count { font-size: 14px; color: #6b7280; }

    .footer {
      text-align: center;
      padding: 32px;
      font-size: 13px;
      color: #94a3b8;
    }

    @media (max-width: 640px) {
      .stats-bar { grid-template-columns: 1fr; }
      .main { padding: 16px; }
      .lead-header { flex-wrap: wrap; gap: 4px; }
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>🔒 线索管理后台</h1>
    <p>上海成焰电子科技 - AI智能助手收集的客户需求档案</p>
  </div>

  <div class="main" id="app">
    <!-- 密码锁 -->
    <div class="lock-screen" id="lockScreen">
      <div class="icon">🔐</div>
      <h2>请输入管理密码</h2>
      <p>请联系管理员获取密码</p>
      <input type="password" class="lock-input" id="passwordInput" placeholder="输入管理密码" autocomplete="off" />
      <button class="lock-btn" id="unlockBtn">进入后台</button>
      <p class="lock-error" id="lockError">密码错误，请重试</p>
    </div>

    <!-- 后台内容（初始隐藏） -->
    <div id="adminContent" style="display:none">
      <div class="toolbar">
        <span class="lead-count" id="leadCount">共 0 条线索</span>
        <button class="refresh-btn" id="refreshBtn">🔄 刷新</button>
      </div>

      <div class="stats-bar" id="statsBar"></div>
      <div id="leadList"></div>
    </div>
  </div>

  <div class="footer">
    上海成焰电子科技 · 客户线索管理系统 · 数据仅管理员可见
  </div>

  <script>
    // 配置：Worker 的 URL（需修改为你自己的）
    const WORKER_URL = 'https://audio-company-ai.305629049.workers.dev';  // ← 部署后填入 Worker 地址

    let currentToken = '';

    // DOM
    const lockScreen = document.getElementById('lockScreen');
    const adminContent = document.getElementById('adminContent');
    const passwordInput = document.getElementById('passwordInput');
    const unlockBtn = document.getElementById('unlockBtn');
    const lockError = document.getElementById('lockError');
    const refreshBtn = document.getElementById('refreshBtn');
    const leadList = document.getElementById('leadList');
    const leadCount = document.getElementById('leadCount');
    const statsBar = document.getElementById('statsBar');

    // 解锁
    unlockBtn.addEventListener('click', () => tryUnlock());
    passwordInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') tryUnlock();
    });

    function tryUnlock() {
      const pw = passwordInput.value.trim();
      if (!pw) return;
      currentToken = pw;
      fetchLeads(true);
    }

    // 刷新
    refreshBtn.addEventListener('click', () => fetchLeads());

    // 获取线索
    async function fetchLeads(isFirstLoad) {
      if (!WORKER_URL) {
        leadList.innerHTML = `<div class="empty-state">
          <div class="icon">⚙️</div>
          <p>请先配置 Worker 地址<br><small>在 admin.html 中修改 WORKER_URL 变量</small></p>
        </div>`;
        return;
      }

      refreshBtn.disabled = true;
      refreshBtn.textContent = '加载中...';

      try {
        const resp = await fetch(WORKER_URL.replace(/\/+$/, '') + '/get-leads?token=' + encodeURIComponent(currentToken));

        if (resp.status === 403) {
          if (isFirstLoad) {
            lockError.style.display = 'block';
            refreshBtn.disabled = false;
            refreshBtn.textContent = '🔄 刷新';
          }
          return;
        }

        if (!resp.ok) {
          throw new Error('请求失败 (' + resp.status + ')');
        }

        const data = await resp.json();

        // 解锁成功
        if (isFirstLoad) {
          lockScreen.style.display = 'none';
          adminContent.style.display = 'block';
        }

        renderLeads(data.leads || []);

      } catch (err) {
        if (isFirstLoad) {
          lockError.textContent = '连接失败: ' + err.message;
          lockError.style.display = 'block';
        } else {
          leadList.innerHTML = `<div class="empty-state"><p>加载失败: ${err.message}</p></div>`;
        }
        console.error(err);
      } finally {
        refreshBtn.disabled = false;
        refreshBtn.textContent = '🔄 刷新';
      }
    }

    // 渲染线索
    function renderLeads(leads) {
      // 统计
      leadCount.textContent = `共 ${leads.length} 条线索`;
      statsBar.innerHTML = `
        <div class="stat-card">
          <div class="stat-num">${leads.length}</div>
          <div class="stat-label">总线索</div>
        </div>
        <div class="stat-card">
          <div class="stat-num">${leads.filter(l => l.phone).length}</div>
          <div class="stat-label">有手机号</div>
        </div>
        <div class="stat-card">
          <div class="stat-num">${leads.filter(l => l.email).length}</div>
          <div class="stat-label">有邮箱</div>
        </div>
      `;

      if (leads.length === 0) {
        leadList.innerHTML = `<div class="empty-state">
          <div class="icon">📭</div>
          <p>暂无客户线索，等 AI 助手收集到第一条后会自动出现</p>
        </div>`;
        return;
      }

      leadList.innerHTML = leads.map((lead, index) => {
        const time = new Date(lead.timestamp);
        const timeStr = time.toLocaleString('zh-CN', { timeZone: 'Asia/Shanghai' });
        return `
          <div class="lead-card">
            <div class="lead-header" onclick="toggleLead(${index})">
              <div>
                <span class="lead-name">${escapeHtml(lead.name)}</span>
                <span class="lead-contact">${escapeHtml(lead.phone)}</span>
              </div>
              <span class="lead-time">${timeStr}</span>
            </div>
            <div class="lead-body" id="lead-body-${index}">
${escapeHtml(lead.summary || '(无需求档案)')}
${lead.email ? '\n\n邮箱: ' + escapeHtml(lead.email) : ''}
            </div>
          </div>
        `;
      }).join('');
    }

    function toggleLead(index) {
      const el = document.getElementById('lead-body-' + index);
      el.classList.toggle('open');
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    // 检查是否已配置 Worker URL
    if (!WORKER_URL) {
      document.getElementById('lockScreen').querySelector('p').textContent =
        '⚠️ 请先配置 Worker URL（在 admin.html 中修改 WORKER_URL 变量）';
    }
  </script>
</body>
</html>
